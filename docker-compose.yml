version: '3'
services:
  nextjs-app:
    build: .
    ports:
      - "3000:3000"
    cpus: "0.5"
    working_dir: /app
    volumes:
      - .:/app:cached            # mount host code with caching for better performance
      - /app/node_modules        # anonymous volume for container node_modules
      - nextjs_build:/app/.next  # store .next in a container volume
    environment:
      NODE_ENV: development
    command: npm run dev

volumes:
  nextjs_build:
